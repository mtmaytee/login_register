services: 
  # Redis service for sessions 
  redis: 
    image: redis:6-alpine 
    container_name: redis_cache 
    ports: 
      - "6379:6379" 
    volumes: 
      - redis_data:/data 
    networks: 
      - app-network 

  # Backend API service 
  backend:
    build: ./backend
    container_name: fastapi_backend
    depends_on:
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "8000:8000"
    networks:
      - app-network

volumes: 
  postgres_data: 
  redis_data: 

networks: 
  app-network: 
    driver: bridge